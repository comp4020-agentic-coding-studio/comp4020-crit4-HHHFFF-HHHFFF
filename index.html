<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Five Notes — a browser instrument with no wrong notes</title>
    <meta
      name="description"
      content="Fifteen pads tuned to one pentatonic scale, synthesised live in your browser. Play them with a mouse, a finger or the keyboard — every pad agrees with every other one, so there is no wrong way to play it."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Five Notes</a>
      </nav>
    </header>

    <main>
      <h1>Five Notes</h1>

      <p class="hint" id="hint">
        <span class="hint__line">
          Press a pad. Or play the rows with <kbd>A</kbd>–<kbd>G</kbd>,
          <kbd>Q</kbd>–<kbd>T</kbd>, <kbd>1</kbd>–<kbd>5</kbd>.
        </span>
        <span class="hint__line" hidden>
          Hold several at once, or drag across them. Every pad agrees with every other
          one — there are no wrong notes in here.
        </span>
      </p>

      <!-- The pads are built from src/scale.ts so the tuning has one home. -->
      <div class="grid" id="grid" role="group" aria-label="Pads"></div>

      <noscript>
        <p class="aside">
          This instrument makes its sound as you play rather than playing anything back,
          so it needs JavaScript switched on.
        </p>
      </noscript>

      <div class="controls">
        <p class="control">
          <label for="tone">Tone</label>
          <input id="tone" type="range" min="0" max="100" value="55" />
        </p>
        <p class="control">
          <label for="room">Room</label>
          <input id="room" type="range" min="0" max="100" value="40" />
        </p>
      </div>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
